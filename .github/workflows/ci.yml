name: CI

on:
  # base 가 main 이 아닌 PR(브랜치를 쌓아 올린 경우)에서도 돌도록 대상을 제한하지 않는다
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 빌드·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Windows 에서 커밋하면 실행 권한이 빠질 수 있다
      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: 테스트
        run: ./gradlew test

      - name: 테스트 결과 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: 프론트 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json 이 없어서 npm ci 를 쓸 수 없다.
      # 락파일이 커밋되면 npm ci 로 바꾸고 setup-node 에 cache: npm 도 켤 수 있다.
      - name: 의존성 설치
        run: npm install

      - name: 빌드
        run: npm run build
