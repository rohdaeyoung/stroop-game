# 👤 담당: 노대영 — 로컬 개발용 (DB 설치 없이 바로 실행)
#
#   ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# 인메모리 H2 라 서버를 끄면 데이터가 사라집니다.
# 실제 MySQL 로 붙이려면 application-local.yml 을 만들어 local 프로필을 쓰세요.
# 운영(Render + TiDB)은 prod 프로필입니다.
spring:
  datasource:
    url: jdbc:h2:mem:stroop;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console 에서 데이터 확인

# 로컬 프론트 주소. Vite 는 5173 이 쓰이고 있으면 5174, 5175... 로 올라가므로
# 개발 중 자주 쓰는 포트를 함께 허용합니다.
# (Vite 프록시는 Origin 헤더를 그대로 넘기기 때문에 포트가 다르면 403 이 납니다)
CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175
